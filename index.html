<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodoro Tracker</title>

    <!-- Handwritten Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Page title -->
        <header class="page-header">
            <h1>Pomodoro ♡</h1>
        </header>


        <!-- =====================================
             BIG TOMATO TIMER
        ====================================== -->

        <section class="tomato">

            <!-- Tomato leaves -->
            <div class="tomato-leaves">

                <div class="leaf leaf-left"></div>

                <div class="leaf leaf-middle-left"></div>

                <div class="stem"></div>

                <div class="leaf leaf-middle-right"></div>

                <div class="leaf leaf-right"></div>

            </div>


            <!-- Tomato highlight -->
            <div class="tomato-highlight"></div>


            <!-- Timer content -->
            <div class="tomato-content">

                <h2 id="modeDisplay">
                    Focus Time
                </h2>


                <!-- Editable timer -->
                <div class="timer-editor">

                    <button
                        id="increaseTimeButton"
                        class="time-adjust-button"
                        aria-label="Increase focus time"
                    >
                        ▲
                    </button>


                    <div id="timer">
                        25:00
                    </div>


                    <button
                        id="decreaseTimeButton"
                        class="time-adjust-button"
                        aria-label="Decrease focus time"
                    >
                        ▼
                    </button>

                </div>


                <!-- Timer buttons -->
                <div class="controls">

                    <button id="startButton">
                        Start
                    </button>

                    <button id="resetButton">
                        Reset
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================
             CURRENT TASK
        ====================================== -->

        <section class="task-section">

            <label for="taskInput">
                What are you working on?
            </label>

            <input
                type="text"
                id="taskInput"
                placeholder="e.g. LeetCode matrix practice"
            >

        </section>


        <!-- =====================================
             DASHBOARD
        ====================================== -->

        <section class="dashboard">


            <!-- Today's Pomodoros -->
            <div class="progress-section">

                <h3>Today's Pomodoros</h3>

                <div id="tomatoTracker">
                    No pomodoros completed yet!
                </div>

                <p>
                    Completed:
                    <span id="completedCount">0</span>
                </p>

            </div>


            <!-- Session History -->
            <div class="history-section">

                <h3>Today's Sessions</h3>

                <div id="sessionHistory">
                    No sessions yet!
                </div>

                <p id="totalFocusTime">
                    Total focus time: 0 minutes
                </p>

            </div>

        </section>


        <!-- Little decorative messages -->

        <div class="encouragement encouragement-left">
            you<br>
            can<br>
            do<br>
            this<br>
            ♡
        </div>

        <div class="encouragement encouragement-right">
            small steps<br>
            big things<br>
            ♡
        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
