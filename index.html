<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pomodoro Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="app">

        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="page-header">

            <h1>Pomodoro ♡</h1>

            <p class="small-message">
                i am a<br>
                big tomato ♡
            </p>

        </header>


        <!-- =====================================
             BIG TOMATO TIMER
        ====================================== -->

        <section class="tomato">

            <!--
                Starts as the still PNG.

                JavaScript switches this to
                bigPomo.gif while focus is running.
            -->

            <img
                id="bigPomoImage"
                src="assets/bigPomo.png"
                alt=""
                class="big-tomato-image"
            >


            <div class="tomato-content">

                <h2 id="modeDisplay">
                    Focus Time
                </h2>


                <div class="timer-editor">

                    <button
                        id="increaseTimeButton"
                        class="time-adjust-button"
                        aria-label="Increase focus time"
                    >
                        ▲
                    </button>


                    <div id="timer">
                        25:00
                    </div>


                    <button
                        id="decreaseTimeButton"
                        class="time-adjust-button"
                        aria-label="Decrease focus time"
                    >
                        ▼
                    </button>

                </div>


                <div class="controls">

                    <button id="startButton">
                        Start
                    </button>

                    <button id="resetButton">
                        Reset
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================
             FALLING TOMATO
        ====================================== -->

        <div id="fallingTomatoArea"></div>


        <!-- =====================================
             BASKET
        ====================================== -->

        <section class="basket-section">

            <div
                id="basket"
                class="basket"
            >

                <div id="basketTomatoes"></div>

                <div class="basket-handle"></div>

                <div class="basket-rim"></div>


                <div class="basket-body">

                    <div class="basket-pattern"></div>

                    <div class="basket-label">
                        Today's<br>
                        Harvest ♡
                    </div>




                </div>

            </div>


            <p class="basket-count">
                Completed:
                <span id="completedCount">0</span>
            </p>

        </section>


        <!-- =====================================
             SESSION HISTORY
        ====================================== -->

        <section class="history-section">

            <h3>
                Today's Sessions
            </h3>


            <div id="sessionHistory">
                No sessions yet ♡
            </div>


            <p id="totalFocusTime">
                Total focus time: 0 minutes
            </p>

        </section>


        <p class="bottom-message">
            you can do this ♡
        </p>

    </main>


    <!-- =====================================
         ACCOMPLISHMENT MODAL
    ====================================== -->

    <div
        id="accomplishmentModal"
        class="modal-overlay hidden"
    >

        <div class="accomplishment-card">

            <div class="mini-tomato">

                <div class="mini-leaf"></div>

                <div class="mini-face">
                    ◡
                </div>

            </div>


            <h2>
                You did it! ♡
            </h2>


            <label for="accomplishmentInput">
                What did you accomplish?
            </label>


            <textarea
                id="accomplishmentInput"
                placeholder="e.g. Finished three LeetCode problems..."
                maxlength="200"
            ></textarea>


            <button id="saveAccomplishmentButton">
                Add to Basket 🍅
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
